apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-db
  template:
    metadata:
      labels:
        app: chat-db
    spec:
      containers:
        - name: chat-db
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: myuser
            - name: POSTGRES_PASSWORD
              value: mypassword
            - name: POSTGRES_DB
              value: chatdb
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: chat-db
spec:
  selector:
    app: chat-db
  ports:
    - port: 5432
      targetPort: 5432
