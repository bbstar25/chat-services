apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:local
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://myuser:mypassword@auth-db:5432/authdb
            - name: SECRET_KEY
              value: 9a1e8995e0b44fa6d16fd3f055af890c24c4224a4f7f58ef5146b9fe1396c182
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30010
