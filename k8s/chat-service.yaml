apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: chat-service:local
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://myuser:mypassword@chat-db:5432/chatdb
            - name: REDIS_URL
              value: redis://redis:6379
            - name: SECRET_KEY
              value: your-generated-secret-key-here
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  type: NodePort
  selector:
    app: chat-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30011
