name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: [ "5437:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ./auth-service
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./auth-service
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5437/testdb
          SECRET_KEY: test-secret-key
        run: pytest -v

  test-chat-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: [ "5438:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
      redis:
        image: redis:7
        ports: [ "6380:6379" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ./chat-service
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./chat-service
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5438/testdb
          REDIS_URL: redis://localhost:6380
          SECRET_KEY: test-secret-key
        run: pytest -v

  test-notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ./notification-service
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./notification-service
        run: pytest -v

  build-and-push:
    needs: [ test-auth-service, test-chat-service, test-notification-service, test-gateway, test-worker ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ auth-service, chat-service, notification-service, gateway, worker ]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  test-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ./gateway

        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./gateway
        run: pytest -v

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ./worker
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./worker
        run: pytest -v
